name: CI

# When should this workflow run?
on:
  push:
    branches:
      - ‘**’

  # pull_request:
  #   branches:
      # - main
      # - develop


jobs:
  video-test:
    name: Run Robotics Subsystem Video Test

    # GitHub's temporary Ubuntu machine
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:

      # --------------------------------------------------
      # 1. Download your repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   # Tell GitHub to download files tracked by Git LFS
        #   lfs: true


      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip uninstall -y opencv-python opencv-python-headless
          pip install opencv-python-headless==4.13.0.92


      # --------------------------------------------------
      # 4. Verify Git LFS files actually exist
      # --------------------------------------------------
      # - name: Verify Git LFS files
      #   run: |
      #     git lfs ls-files
      #     git lfs pull


      # --------------------------------------------------
      # 6. Run your actual robotics subsystem
      # --------------------------------------------------
      - name: Run Huey vs Prince
        env:
          TEST_VIDEO: "test_videos/shorty_vs_prince.mp4"
          MATRIX: "/homography_matrix_test.txt"
          COLOR: "/selected_colors_test.txt"
        run: |
          python test.py
      - name: Run 2-Corners
        env: 
          TEST_VIDEO: "test_videos/blink224_huey.mp4"
          MATRIX: "/homography_matrix_2corn.txt"
          COLOR: "/selected_colors_2corn.txt"
        run: |
          python test.py