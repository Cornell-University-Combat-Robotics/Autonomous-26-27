[project]
name = "aaron-sysdesign-playground"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "requests>=2.34.2",
    "roboflow>=1.3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "viztracer>=1.1.1",
]

[tool.ruff.lint.per-file-ignores]
# Each service's __init__.py intentionally re-exports its public names for
# `from <service> import X` imports elsewhere; ruff's default unused-import
# check doesn't know that's the point of the file.
"__init__.py" = ["F401"]
