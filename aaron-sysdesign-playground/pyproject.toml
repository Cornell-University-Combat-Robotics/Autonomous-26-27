[project]
name = "aaron-sysdesign-playground"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
    "roboflow>=1.3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "viztracer>=1.1.1",
]

[tool.ruff.lint.per-file-ignores]
# Each service's __init__.py intentionally re-exports its public names for
# `from <service> import X` imports elsewhere; ruff's default unused-import
# check doesn't know that's the point of the file.
"__init__.py" = ["F401"]

[tool.uv]
# roboflow depends on opencv-python-headless, which installs its own native
# cv2 extension into the same site-packages/cv2 as our direct opencv-python
# dependency -- having both installed corrupts the merged module (breaks on
# import with an AttributeError in cv2.gapi). We need the non-headless
# build anyway, for warp/'s imshow/waitKey-based corner picker. This
# overrides opencv-python-headless everywhere in the dependency graph with
# an unsatisfiable marker, so uv resolves/installs only opencv-python.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
